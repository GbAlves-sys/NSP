<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atividades da turma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1740;--bg:#f3f1ff;--card:#fff;--brand:#4a3fd6;--sun:#ffd23f;--ok:#12805c;--okbg:#dff5ec;--bad:#b3261e;--badbg:#fde4e1;--mute:#5d5a80;--line:#d9d5f5}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(2rem,7vw,3rem);font-weight:800}
h2{font-size:1.6rem;font-weight:800}
.sub{color:var(--mute);margin:10px 0 26px}
.days{display:grid;gap:14px}
.day{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px 20px;cursor:pointer;box-shadow:5px 5px 0 var(--ink)}
.day:hover:not(:disabled){background:var(--sun)}
.day:disabled{border-color:var(--line);box-shadow:none;color:var(--mute);cursor:not-allowed;background:#ece9fb}
.day b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.35rem;display:block}
.tag{font-size:.9rem;font-weight:600;white-space:nowrap}
label.n{display:block;font-weight:600;margin:26px 0 6px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{font:inherit;font-weight:600;background:var(--brand);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:12px 22px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.video{position:relative;aspect-ratio:16/9;margin:20px 0 8px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{display:grid;place-items:center;height:100%;color:#fff;padding:20px;text-align:center}
.q{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px 20px;margin:18px 0}
.q h3{font-size:1.15rem;font-weight:600;font-family:Figtree,sans-serif;line-height:1.35;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:#ecebff}
.opt input{margin-top:5px;accent-color:var(--brand)}
.err{color:var(--bad);font-weight:600;min-height:1.5em}
.proof{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:22px 20px;box-shadow:6px 6px 0 var(--ink)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:16px 0}
.meta dt{color:var(--mute)}.meta dd{margin:0;font-weight:600}
.score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:3rem;line-height:1;background:var(--sun);display:inline-block;padding:6px 16px;border-radius:12px;border:2px solid var(--ink)}
.fb{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.97rem}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb strong{display:block}
.print{margin-top:16px;font-weight:600}
.back{background:none;border:0;font:inherit;color:var(--brand);font-weight:600;cursor:pointer;padding:0 0 10px;text-decoration:underline}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.proof{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* =====================  EDITE AQUI  ===================== */
const CONFIG = {
  titulo: "Atividades da turma",
  professor: "Prof. Gabriel Alves",
  fecharDepois: false,   // true = depois do dia, a atividade fecha
  permitirTeste: true,   // true = ?teste=2026-12-02 na URL simula a data. Coloque false ao publicar
};

const DIAS = [
  {
    data: "2026-11-25",
    titulo: "Atividade 1: Números decimais",
    videoId: "ijhusRH1P7M",
    perguntas: [
      { q: "Como se lê o número 0,75?", o: ["Setenta e cinco décimos", "Sete inteiros e cinco décimos", "Setenta e cinco centésimos", "Setenta e cinco milésimos"], c: 2 },
      { q: "Qual é a fração decimal que representa 0,3?", o: ["3/100", "30/10", "3/10", "1/3"], c: 2 },
      { q: "Qual é o maior número entre os apresentados?", o: ["0,89", "0,099", "0,45", "0,9"], c: 3 },
      { q: "Quanto é 2,35 + 1,7?", o: ["3,52", "4,05", "4,42", "3,05"], c: 1 },
      { q: "Quanto é 5,2 − 1,75?", o: ["3,55", "4,55", "3,45", "3,65"], c: 2 },
      { q: "Quanto é 0,4 × 0,3?", o: ["1,2", "0,7", "0,012", "0,12"], c: 3 },
      { q: "Quanto é 3,6 ÷ 4?", o: ["0,9", "9", "0,09", "1,4"], c: 0 },
      { q: "Qual fração é equivalente a 0,5?", o: ["1/5", "1/50", "5/100", "1/2"], c: 3 },
      { q: "No número 12,846, o algarismo 4 ocupa a casa dos:", o: ["Décimos", "Centésimos", "Milésimos", "Unidades"], c: 1 },
      { q: "Pedro comprou 3 cadernos de R$ 7,50 cada e pagou com uma nota de R$ 50,00. Qual foi o troco?", o: ["R$ 27,50", "R$ 22,50", "R$ 42,50", "R$ 25,50"], c: 0 }
    ]
  },
  {
    data: "2026-12-02",
    titulo: "Atividade 2: Porcentagem",
    videoId: "nnNU6DfOxfQ",
    perguntas: [
      { q: "Quanto é 50% de 80?", o: ["4", "40", "400", "20"], c: 1 },
      { q: "Quanto é 25% de 200?", o: ["25", "100", "50", "75"], c: 2 },
      { q: "Quanto é 10% de 350?", o: ["0,35", "3,5", "350", "35"], c: 3 },
      { q: "A fração 3/4 corresponde a qual porcentagem?", o: ["75%", "34%", "43%", "7,5%"], c: 0 },
      { q: "O número decimal 0,35 corresponde a qual porcentagem?", o: ["0,35%", "3,5%", "35%", "350%"], c: 2 },
      { q: "Uma camiseta custa R$ 80,00 e está com 20% de desconto. Quanto ela custa agora?", o: ["R$ 60,00", "R$ 64,00", "R$ 16,00", "R$ 72,00"], c: 1 },
      { q: "Um salário de R$ 1.500,00 teve aumento de 10%. Qual é o novo salário?", o: ["R$ 1.510,00", "R$ 1.600,00", "R$ 1.750,00", "R$ 1.650,00"], c: 3 },
      { q: "15 é quantos por cento de 60?", o: ["25%", "15%", "40%", "4%"], c: 0 },
      { q: "Em uma turma de 40 alunos, 60% são meninas. Quantas meninas há na turma?", o: ["16", "20", "24", "30"], c: 2 },
      { q: "Um produto de R$ 200,00 teve aumento de 10% e, depois, desconto de 10% sobre o novo preço. Qual é o preço final?", o: ["R$ 200,00", "R$ 198,00", "R$ 202,00", "R$ 220,00"], c: 1 }
    ]
  }
];
/* ======================================================== */

const app = document.getElementById("app");
const L = "ABCDEFGH";
let aluno = "";
try { aluno = sessionStorage.getItem("aluno") || ""; } catch (e) {}

const pad = n => String(n).padStart(2, "0");
function hoje() {
  const t = CONFIG.permitirTeste && new URLSearchParams(location.search).get("teste");
  if (t && /^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
const br = iso => iso.split("-").reverse().join("/");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function estado(d) {
  const h = hoje();
  if (h < d.data) return "futuro";
  if (h > d.data && CONFIG.fecharDepois) return "passado";
  return "aberto";
}

function home() {
  window.scrollTo(0, 0);
  app.innerHTML = `
    <h1>${esc(CONFIG.titulo)}</h1>
    <p class="sub">${esc(CONFIG.professor)}. Cada atividade abre no dia marcado: assista ao vídeo, responda o questionário e envie o print da tela final.</p>
    <label class="n" for="nome">Seu nome completo</label>
    <input type="text" id="nome" autocomplete="name" value="${esc(aluno)}" placeholder="Nome e sobrenome">
    <div class="err" id="erro"></div>
    <div class="days" style="margin-top:22px">
      ${DIAS.map((d, i) => {
        const s = estado(d);
        const tag = s === "aberto" ? "Abrir" : s === "futuro" ? "Disponível em " + br(d.data).slice(0, 5) : "Encerrada";
        return `<button class="day" data-i="${i}" ${s !== "aberto" ? "disabled" : ""}>
          <span><b>${esc(d.titulo)}</b>${br(d.data)}</span><span class="tag">${s === "aberto" ? "" : "🔒 "}${tag}</span></button>`;
      }).join("")}
    </div>`;
  app.querySelectorAll(".day").forEach(b => b.onclick = () => {
    const n = document.getElementById("nome").value.trim();
    if (n.split(/\s+/).length < 2) { document.getElementById("erro").textContent = "Digite nome e sobrenome para continuar."; document.getElementById("nome").focus(); return; }
    aluno = n;
    try { sessionStorage.setItem("aluno", n); } catch (e) {}
    atividade(+b.dataset.i);
  });
}

function atividade(i) {
  const d = DIAS[i];
  if (estado(d) !== "aberto") return home();   // checagem extra
  window.scrollTo(0, 0);
  const temVideo = d.videoId && !d.videoId.startsWith("COLE");
  app.innerHTML = `
    <button class="back" id="voltar">Voltar</button>
    <h2>${esc(d.titulo)}</h2>
    <p class="sub">${esc(aluno)} · ${br(d.data)}</p>
    <div class="video">${temVideo
      ? `<div id="yt"></div>`
      : `<div class="ph">Cole o ID do vídeo do YouTube em DIAS no index.html</div>`}</div>
    <p class="sub">Assista ao vídeo inteiro e depois responda às ${d.perguntas.length} perguntas.${temVideo ? ` Se o vídeo der erro, <a href="https://www.youtube.com/watch?v=${encodeURIComponent(d.videoId)}" target="_blank" rel="noopener"><b>assista no YouTube</b></a> (abre em outra aba) e volte aqui.` : ""}</p>
    <div id="qs">${d.perguntas.map((p, k) => `
      <fieldset class="q" style="border:2px solid var(--ink);min-width:0">
        <legend class="hidden">Pergunta ${k + 1}</legend>
        <h3>${k + 1}. ${esc(p.q)}</h3>
        ${p.o.map((t, j) => `<label class="opt"><input type="radio" name="q${k}" value="${j}"><span><b>${L[j]}.</b> ${esc(t)}</span></label>`).join("")}
      </fieldset>`).join("")}</div>
    <div class="err" id="erro" role="alert"></div>
    <button class="btn" id="enviar">Finalizar atividade</button>`;
  if (temVideo) criarPlayer(d.videoId);
  document.getElementById("voltar").onclick = home;
  document.getElementById("enviar").onclick = () => {
    const resp = d.perguntas.map((_, k) => { const r = app.querySelector(`input[name=q${k}]:checked`); return r ? +r.value : null; });
    const falta = resp.findIndex(r => r === null);
    if (falta >= 0) { document.getElementById("erro").textContent = `Responda a pergunta ${falta + 1} para finalizar.`; return; }
    resultado(i, resp);
  };
}

function criarPlayer(id) {
  const box = document.querySelector(".video");
  const fallback = () => {
    box.innerHTML = `<a class="ph" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" style="background:linear-gradient(#0008,#0008),url(https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg) center/cover;color:#fff;font-weight:600;text-decoration:none">▶ Assistir no YouTube<br><small>abre em outra aba; depois volte aqui para responder</small></a>`;
  };
  const start = () => {
    try {
      new YT.Player("yt", { videoId: id, host: "https://www.youtube-nocookie.com", playerVars: { rel: 0, playsinline: 1 }, events: { onError: fallback } });
    } catch (e) { fallback(); }
  };
  if (window.YT && YT.Player) return start();
  window.onYouTubeIframeAPIReady = start;
  if (!document.getElementById("yt-api")) {
    const sc = document.createElement("script");
    sc.id = "yt-api"; sc.src = "https://www.youtube.com/iframe_api"; sc.onerror = fallback;
    document.head.appendChild(sc);
  }
}

function resultado(i, resp) {
  const d = DIAS[i], n = d.perguntas.length;
  const acertos = resp.filter((r, k) => r === d.perguntas[k].c).length;
  const agora = new Date();
  const quando = `${pad(agora.getDate())}/${pad(agora.getMonth() + 1)}/${agora.getFullYear()} às ${pad(agora.getHours())}:${pad(agora.getMinutes())}:${pad(agora.getSeconds())}`;
  window.scrollTo(0, 0);
  app.innerHTML = `
    <div class="proof">
      <h2>Atividade concluída</h2>
      <dl class="meta">
        <dt>Aluno</dt><dd>${esc(aluno)}</dd>
        <dt>Atividade</dt><dd>${esc(d.titulo)} (${br(d.data)})</dd>
        <dt>Concluída em</dt><dd>${quando}</dd>
      </dl>
      <div class="score">${acertos}/${n}</div>
      <span style="margin-left:10px;font-weight:600">${acertos === n ? "Acertou tudo!" : acertos + (acertos === 1 ? " acerto" : " acertos") + " e " + (n - acertos) + (n - acertos === 1 ? " erro" : " erros")}</span>
      ${d.perguntas.map((p, k) => {
        const ok = resp[k] === p.c;
        return `<div class="fb ${ok ? "ok" : "no"}"><strong>${ok ? "✓" : "✗"} Pergunta ${k + 1}: ${ok ? "certa" : "errada"}</strong>
          ${ok ? "Sua resposta: " + L[resp[k]] + ". " + esc(p.o[resp[k]])
               : "Você marcou " + L[resp[k]] + ". Resposta correta: " + L[p.c] + ". " + esc(p.o[p.c])}</div>`;
      }).join("")}
      <p class="print">📸 Tire um print desta tela inteira (mostrando seu nome, a data e a nota) e envie para ${esc(CONFIG.professor)}.</p>
    </div>
    <p style="margin-top:20px"><button class="btn alt" id="inicio">Voltar ao início</button></p>`;
  document.getElementById("inicio").onclick = home;
}

home();
</script>
</body>
</html>
